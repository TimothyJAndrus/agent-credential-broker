[project]
name = "agent-credential-broker"
version = "0.1.0"
description = "Short-lived, scoped credentials for AI agents: policy, human approval, tamper-evident audit, JWT and AWS STS backends."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S", "C4", "TRY004"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["aws: hits real AWS; needs ACB_AWS_TESTS=1 and credentials"]
